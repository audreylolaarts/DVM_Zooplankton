<script>

//main equation:
//F(x,t,T) = (1-ßi)[λi F(xi', t+1, T) + (1-λi)F(xi'', t+1, T)]

//example dataset (Trout Lake, May 1992)
//units: depth m, temp °C, chl μg/L chlorophyll a, predators = fish per
//1000 m^3 (McAfee 2021; the model divides by 1000 to get fish per m^3),
//food_prob = probability of finding food (fixed at 0.5)
const trmay92_df = [
  { depth: 0,  temp: 8.9, chl: 10.6,  predators: 6.31, food_prob: 0.5 },
  { depth: 2,  temp: 8.8, chl: 11,    predators: 1.5,  food_prob: 0.5 },
  { depth: 4,  temp: 8.8, chl: 12.1,  predators: 0.9,  food_prob: 0.5 },

  { depth: 8,  temp: 8.2, chl: 12.8,  predators: 8.57, food_prob: 0.5 },
  { depth: 10, temp: 7.9, chl: 11.5,  predators: 13.52, food_prob: 0.5 },
  { depth: 12, temp: 6.7, chl: 9.8,   predators: 25.7, food_prob: 0.5 },
  { depth: 14, temp: 6.6, chl: 10.25, predators: 22.1, food_prob: 0.5 },
  { depth: 16, temp: 6.6, chl: 10.6,  predators: 21.2, food_prob: 0.5 },
  { depth: 18, temp: 6.4, chl: 10.6,  predators: 5.4,  food_prob: 0.5 },
  { depth: 20, temp: 6,   chl: 10.7,  predators: 1.4,  food_prob: 0.5 },
  { depth: 22, temp: 5.6, chl: 9,     predators: 1.4,  food_prob: 0.5 },
  { depth: 24, temp: 5.3, chl: 8.3,   predators: 1.8,  food_prob: 0.5 },
  { depth: 26, temp: 5.2, chl: 7.5,   predators: 3,    food_prob: 0.5 },
  { depth: 28, temp: 5.2, chl: 6.9,   predators: 4.5,  food_prob: 0.5 },
  { depth: 30, temp: 5.2, chl: 6,     predators: 0,    food_prob: 0.5 },
  { depth: 32, temp: 5.1, chl: 5.5,   predators: 0,    food_prob: 0.5 },
];

function luxToPPFD(lux, calibrationFactor = 0.0185) {
  return lux * calibrationFactor;
}

const n_timesteps = 12;
const critical = 5;
const capacity = 60;
const k = 0.48;
const light_day = luxToPPFD(105253);
const light_night = 0.15;

//setting the boundaries for size of Daphnia or flagging starvation
function chop(formula, lower, upper){
  let value;
  if (formula>upper){
    value=upper;
  }
  if (formula>=lower && formula<=upper){
    value=formula;
  }
  if (formula<lower){
    value=0;
  }
  return value;
}

//1 if Daphnia is alive, 0 if not
function critCompare(value, critical) {
  if (value>critical){
    return 1;
  } else {return 0};
}

//initialize fitness tables

//create an empty array for F0, filled with the number of sizes classes between x_crit and x_max in intervals of 5
function initFZero(x_crit, x_max){
  const n = (x_max-x_crit)/5+1;
  let F0= new Array(n).fill(0);
  return F0;
}

//starting F1 table
//create a table object F1 which matches depths with an aray for each size class. The array is filled with 1 and 0 indicating whether Daphnia at that size class at that depth is alive or not.
function initFOne (x_crit, x_max, patchDepths){
  const sizes = [];
  for (let x=x_crit; x<=x_max; x+=5) sizes.push(x);
  const F1={};
  for (const depth of patchDepths){
    F1[depth]=sizes.map(x=> critCompare(x,x_crit));
  }
  return F1;
}

//compute_v function
//alpha=baseline metabolic cost
//upsilon or Y=energetic value of food it ate
//lambda=probability of finding food
//beta=predation risk in a given patch
//xp1= size of Daphnia in previous timestep after ingesting food in a given patch and expending energy
//xp2=size of Daphnia in same previous timestep but with the probability of not finding food

function compute_v(x, alpha, beta, lambda, upsilon, x_crit, x_max, F1, depth){
  const idx = (x - x_crit)/5 //create index number to navigate f1

  const xfit = F1[depth][idx];
  //xfit used to locate fitness value at depth and index in F1

//calculating x' and x''.
  //x' is the outcome if food is found, x'' is the outcome if food is not found.
  const xp1 = chop(x-alpha+upsilon, x_crit, x_max);
  const xp2 = chop (x-alpha, x_crit, x_max);

  //retrieve info about x at depth from F1
  const idxUp=Math.min(idx+1, (x_max-x_crit)/5);
  const idxDown=Math.max(idx-1,0);

  //fitnesses at indexes higher and lower than x
  let fitxp1plus;
  if (xp1>=x){
    fitxp1plus= F1[depth][idxUp];
  } else {
    fitxp1plus = F1[depth][idxDown];
  }

  const fitxp2plus= F1[depth][idxDown];

  //interpolate fitness values

  //calculate a fraction representing how far xp1 is from x
  const prop_xp1= (xp1-x)/5;

  //estimate fitness at xp1
  const fitxp1 = ((fitxp1plus-xfit)* prop_xp1)+xfit;

  //calculate a fraction representing how far xp2 is from x
  const prop_xp2 = (xp2-x)/5;

  //estimate fitness at xp2
  const fitxp2 = ((fitxp2plus-xfit)* prop_xp2)+xfit;

  //fitness calculation

  //predation risk
  const surv_prob=1-beta;

  //average two possible futures (found food vs didn't, weighted by how likely each one is)
  const starv_prob=(lambda*fitxp1)+((1-lambda)*fitxp2);

  //predation risk * food probability
  const v = surv_prob * starv_prob;

  return v;
}

//get_patches function

function get_patches(data, depth, food_prob, fish_abun, chl, temp, k, lsurf, x){

  //Body length (mm) from weight (μg) - allometric power-law relationship
  const lengthx=Math.pow(10, (Math.log10(x)-Math.log10(10.674))/2.093);

  //create object organized by patch depth
  const grouped={};
  for (const row of data){
    //round depths to nearest 2m bin and add to object
    const patch = 2 * Math.round(row[depth]/2);
    (grouped[patch] ??=[]).push(row);
  }

    const data_sum={};
    for (const patch of Object.keys(grouped)){
      //create an array of all the environmental data in each row
      const rows = grouped[patch];
        //starting from 0, go through every row r in rows, and each time, add r[key] to the running total sum.
      const avg = key => rows.reduce((sum,r) => sum + r[key],0)/rows.length;
      data_sum[patch]={
        food_prob: avg(food_prob),
        predn: avg(fish_abun),
        chl: avg(chl),
        temp: avg(temp),
      };
    }

//define constants from pre-existing data
      const RDSAT = 0.16504;
      const RDHALF = 0.035;
      const SSPEED = 0.15;
      const HANDLE = 1.8;
      const PDENS = 10000;
      const ASSIM = 0.6;

    const data_out = [];
      for (const patch of Object.keys(data_sum)){
        //pull properties from object and assign each its own variable
        const fp = data_sum[patch].food_prob;
        const predn = data_sum[patch].predn;
        const chlVal = data_sum[patch].chl;
        const tempVal = data_sum[patch].temp;

        //calculations
        const Alpha=0.007 * Math.pow(x, 0.81) * (Math.exp(0.06931 * tempVal)/2);
        const Light = lsurf * Math.exp(-k*2*patch);
        const React = RDSAT * lengthx * (Light / (RDHALF + Light));
        const Denom1 = Math.PI * SSPEED * PDENS * HANDLE * Math.pow(React, 2) + 1e-100;
        const Frate = (1/ HANDLE) / (1+ (1 / Denom1));
        const Consum = Frate * (predn / 1000) * 108000;
        const Beta = Consum / PDENS;
        const Lambda = fp;
        const ups_coeff = (chlVal * (0.029 * tempVal - 0.028)) / (0.41 * (0.3 * chlVal + 0.42));
        const Upsilon = ASSIM * (ups_coeff * Math.pow(lengthx / 2, 2.43 - 0.044 * tempVal)) / 2;

        data_out.push({ patch: Number(patch), Alpha, Light, React, Denom1, Frate, Consum, Beta, Lambda, ups_coeff, Upsilon });
}
  return data_out;
}

//max_v function
//picks winning patch per size and records it

function max_v(x_crit, x_max, F0, D, F1, data, depth, food_prob, fish_abun, chl, temp, k, lsurf){
  //create copy of F1 with built-in JS structuredClone
  const F1_ref=structuredClone(F1);

  for (let x=x_crit; x<=x_max; x+=5){
    let u=(x-x_crit)/5;
    let vm=0; //max fitness found so far, for this size
    const patches=get_patches(data, depth, food_prob, fish_abun, chl, temp, k, lsurf, x);
    for (const i of patches){
      let v=compute_v(x, i.Alpha, i.Beta, i.Lambda, i.Upsilon, x_crit, x_max, F1, i.patch);
      F1_ref[i.patch][u]=v;
      if (v>vm){
        vm=v;
        F0[u]=v;
        D[u]=i.patch;
      }
    }
  }
  return {
    F1: F1_ref, F0, D
  };
}

//dvmsimulation function
//repeats across every timestep, walking backward from terminal condition

function dvmsimulation(n_timesteps, critical, capacity, data, depth, food_prob, fish_abun, chl, temp, k, lsurf){

  //Step 1- initialize fitness arrays

  const patchDepths = [...new Set(data.map(row=>2*Math.round(row[depth]/2)))];
  let F0=initFZero(critical, capacity);
  let D= initFZero(critical, capacity);
  let F1=initFOne(critical, capacity, patchDepths);

  const complete_output=[];

  //Step 2 - Iterate over timesteps, getting max fitness values

  for (let t=1; t<=n_timesteps; t++){
    ({F1, F0, D}=max_v(critical, capacity, F0, D, F1, data, depth, food_prob, fish_abun, chl, temp, k, lsurf));

    for (let x=critical; x<=capacity; x+=5){

      const u=(x-critical)/5;

      complete_output.push({Timestep: t, Size: x, Fitness: F0[u], Depth: D[u]});
    }
  }
  return complete_output;
}

// ============================================================
// p5.js sketch - "Lake Through Time": plays the Trout Lake record week
// by week, each week as one day-night cycle, from 1981 to the present.
// ============================================================

// ---- population ------------------------------------------------------
// Daphnia density comes from the timeline data, step by step. Scale and
// size mix as in the other drawings (see dvm_lake_map_slider.html).
// Size mix: share of Daphnia in each model size class (μg), from the
// dataset's avg_length (mm; values >5 are μm, from 2023 on, and were
// divided by 1000), converted to weight with the model's own allometry
// W = 10.674 * L^2.093, rounded to the nearest 5 μg class (classes below
// 5 μg folded into 5), weighted by density. 378 measured rows, 1990-2025.
// The field population is mostly small: no measured averages reach 25 μg.
const SIZE_SHARE = { 5: 0.8477, 10: 0.1304, 15: 0.0201, 20: 0.0018 };
// avg_length is an average per species per date, which hides the larger
// adults in each sample, so every model class gets at least this share of
// the dots to stay visible. Set to 0 to draw the measured mix exactly.
const SIZE_SHARE_FLOOR = 0.01;

// Trout Lake volume: 0.240 km^3 = 2.40e11 L (Wisconsin DNR lake data)
const LAKE_VOLUME_L = 2.40e11;

// Scale: dots drawn per (Daphnia per liter). At 200, each dot stands for
// about 2.40e11 / 200 = 1.2 billion Daphnia in the whole lake.
const DOTS_PER_DENSITY = 200;
const DAPHNIA_PER_DOT = LAKE_VOLUME_L / DOTS_PER_DENSITY;

//splits `total` dots across the model's size classes by SIZE_SHARE (with
//the floor), using largest-remainder rounding so the counts add up exactly
function allocateDots(total, sizes) {
  const raw = sizes.map(s => Math.max(SIZE_SHARE[s] || 0, SIZE_SHARE_FLOOR));
  const sum = raw.reduce((a, b) => a + b, 0);
  const exact = raw.map(r => (r / sum) * total);
  const counts = exact.map(Math.floor);
  let left = total - counts.reduce((a, b) => a + b, 0);
  exact.map((e, i) => [e - Math.floor(e), i]).sort((a, b) => b[0] - a[0])
    .slice(0, left).forEach(([, i]) => counts[i]++);
  return counts;
}

//"820 billion", "1.2 billion"
function bigNumber(n) {
  if (n >= 1e12) return (n / 1e12).toFixed(n >= 1e13 ? 0 : 1) + " trillion";
  if (n >= 1e9) return (n / 1e9).toFixed(n >= 1e10 ? 0 : 1) + " billion";
  return Math.round(n / 1e6) + " million";
}

const minCircleDiameter = 2.5; // size at `critical` (smallest Daphnia)
const maxCircleDiameter = 11;  // size at `capacity` (largest Daphnia)

// ---- visual style --------------------------------------------------
// Sky color is keyed to the light reading on a log scale (light spans
// ~4 orders of magnitude, so a linear scale would leave all the dusk/
// dawn colors crammed into the first sliver of the slider). Each stop is
// [lightFrac, topColor, horizonColor].
const skyStops = [
  [0.00, [4, 8, 24],     [16, 26, 58]],     // night
  [0.30, [34, 38, 92],   [214, 116, 96]],   // twilight
  [0.60, [62, 120, 196], [236, 198, 160]],  // morning / evening
  [1.00, [54, 138, 226], [176, 218, 246]],  // midday
];

// water is a two-tone noise field (calm tone <-> bright tone), darkened
// with depth and dimmed with the light level
const waterCalm = [14, 74, 116];
const waterBright = [52, 150, 178];

// each dot's gentle idle motion (px amplitude, ms-based speed)
const bobAmpRange = [2, 4.5];
const bobSpeedRange = [0.0011, 0.0021];
const swayAmp = 2.5;

const waterResolution = 8; // water noise is computed at 1/8 res, then scaled up smooth

// ------------------------------------------------------------
// Timeline data (timeline_data.js, built by scripts/build_timeline_data.py)
//
// One step per week, from the first Trout Lake temperature profile
// (April 1981) to the newest. Each step carries the water temperature
// and chlorophyll profiles, the Daphnia density, and that day's hourly
// wind and surface light. Gaps between field samples are filled by
// straight-line interpolation (gaps up to 60 days) or, for longer gaps,
// the typical value for that time of year; the readout says which.
// ------------------------------------------------------------
const TL = window.TIMELINE_DATA;
const STEPS = TL.steps;
const N_STEPS = STEPS.length;
const QUALITY_WORD = { m: "measured", i: "interpolated", e: "typical for the season" };

// ---- pacing ----------------------------------------------------------
// Each step (one week) plays as one full day, midnight to midnight, in
// DAY_MS of real time. At 3000 ms the full 1981-2025 record takes about
// 2 hours. Lower it to speed up (e.g. 1500 = about 1 hour).
const DAY_MS = 3000;
const END_HOLD_MS = 5000;  // pause on the last day before looping back

// the most dots ever drawn (June peaks can exceed 30 Daphnia/L, which
// at 200 dots per Daphnia/L would be too many to animate smoothly)
const MAX_DOTS = 1600;

// ---- ice -------------------------------------------------------------
// Ice-on / ice-off dates from the NTL-LTER Ice Duration dataset. While
// the lake is frozen the model is NOT run: it was built for open water
// (its light, temperature and fish-feeding terms don't describe life
// under snow-covered ice). Instead the Daphnia spread out in the upper
// water just below the ice and drift slowly, without migrating:
//   - food: in the chlorophyll data, January-March chlorophyll peaks at
//     2-6 m (about 2.6 μg/L in January), falling to ~1 by 16 m;
//   - little reason to hide: snow and ice cut light to a small fraction,
//     and fish feed slowly in near-freezing water, so the daytime risk
//     that drives the daily dive mostly disappears.
// The number of Daphnia still follows the measured winter densities,
// which are very low (about 0.2-0.6 per liter).
const WINTER_DEPTH = { min: 2, max: 8 };     // m
const UNDER_ICE_LIGHT = 0.1;                  // fraction of daylight reaching the water, for the picture
const ICE_PERIODS = TL.ice.map(([on, off]) => [on, off]);

function iceSince(dateStr) {
  for (const [on, off] of ICE_PERIODS) if (dateStr >= on && dateStr < off) return on;
  return null;
}

// ---- time & light ------------------------------------------------------

// Trout Lake
const LAKE_LAT = 46.03;
const LAKE_LON = -89.67;
// the weather station logs local standard time (CST, UTC-6) all year
const CST_OFFSET_H = 6;

const lightRange = { min: light_night, max: Math.round(light_day) };

function stepDate(i) {
  const [y, m, d] = STEPS[i][0].split("-").map(Number);
  return { y, m, d };
}

//real Date for step i at fractional CST hour h
function stepInstant(i, h) {
  const { y, m, d } = stepDate(i);
  return new Date(Date.UTC(y, m - 1, d) + (h + CST_OFFSET_H) * 3600e3);
}

//solar elevation (degrees) at Trout Lake (NOAA approximation)
function solarElevation(date) {
  const rad = Math.PI / 180;
  const start = Date.UTC(date.getUTCFullYear(), 0, 1);
  const doy = Math.floor((date.getTime() - start) / 86400000) + 1;
  const hourUTC = date.getUTCHours() + date.getUTCMinutes() / 60 + date.getUTCSeconds() / 3600;
  const g = (2 * Math.PI / 365) * (doy - 1 + (hourUTC - 12) / 24);
  const decl = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g)
    - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g)
    - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
  const eqtime = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g)
    - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
  const solarMin = hourUTC * 60 + eqtime + 4 * LAKE_LON;
  const ha = (solarMin / 4 - 180) * rad;
  const lat = LAKE_LAT * rad;
  const cosZen = Math.sin(lat) * Math.sin(decl) + Math.cos(lat) * Math.cos(decl) * Math.cos(ha);
  return 90 - Math.acos(constrain(cosZen, -1, 1)) / rad;
}

//rough clear-sky surface PAR (umol/m2/s) from the sun's height
function estimatedSurfacePAR(date) {
  const h = solarElevation(date);
  const sun = h > 0 ? 2000 * Math.pow(Math.sin(h * Math.PI / 180), 1.2) : 0;
  // civil twilight only: fades from ~10 at sunrise to the floor at -6 deg
  const twilight = h > -6 && h <= 0 ? 10 * Math.pow(10, h / 3) : 0;
  return Math.max(sun, twilight, light_night);
}

//hourly series value at fractional hour h. Each stored value is the
//average for the hour ending at that hour, so it is centered half an
//hour earlier; interpolate between neighbouring centers.
function hourly(arr, h) {
  const x = (h + 0.5 + 24) % 24;
  const i0 = Math.floor(x) % 24;
  const i1 = (i0 + 1) % 24;
  const f = x - Math.floor(x);
  return arr[i0] + (arr[i1] - arr[i0]) * f;
}

function surfaceLightAt(i, h) {
  const par = STEPS[i][5];
  if (par) return { value: Math.max(hourly(par, h), light_night), source: "measured, Woodruff Airport" };
  return { value: estimatedSurfacePAR(stepInstant(i, h)), source: "estimated from the sun's position" };
}

function windAt(i, h) {
  return hourly(STEPS[i][4], h);
}

// ---- playback state ---------------------------------------------------
let stepIdx = 0;
let dayFrac = 0;           // 0..1 through the current day
let playing = true;
let dragging = false;
let endHoldUntil = 0;
let lastFrameMs = 0;

let modelKey = "";         // which step/hour the dots were last placed for
let iceAmount = 0;         // 0 open water .. 1 fully frozen (eased, for the picture)
let currentPopulation = 0;
let currentLight = { value: light_night, source: "" };
let currentWind = 0;

// ---- layout ------------------------------------------------------------
const leftMargin = 90;
const rightMargin = 40;
const bottomMargin = 184;

let lakeLeft, lakeRight, lakeTop, bandHeight;
let numRows = 17;
let waterCanvas, waterCtx, waterData;
let dots = [];             // the full pool; how many show depends on the density
let timeSlider, playButton;

const SIZES = [];
for (let x = critical; x <= capacity; x += 5) SIZES.push(x);
const MAX_PER_CLASS = allocateDots(MAX_DOTS, SIZES);

function setup() {
  createCanvas(windowWidth, windowHeight);
  noiseDetail(2, 0.5);

  // pool of dots: each has a size class and a rank within it; a dot is
  // visible when its rank is below that class's current count
  SIZES.forEach((size, c) => {
    const diameter = map(size, critical, capacity, minCircleDiameter, maxCircleDiameter);
    for (let r = 0; r < MAX_PER_CLASS[c]; r++) {
      dots.push({
        cls: c, rank: r, size, diameter,
        xFrac: random(0, 1), yJitterFrac: random(0, 1), spreadZ: gaussian(),
        bobPhase: random(TWO_PI), swayPhase: random(TWO_PI),
        bobSpeed: random(bobSpeedRange[0], bobSpeedRange[1]),
        bobAmp: random(bobAmpRange[0], bobAmpRange[1]),
        winterDepth: random(WINTER_DEPTH.min, WINTER_DEPTH.max),
        driftPhase: random(TWO_PI),
        prevDepth: 4, targetDepth: 4, transitionStart: 0, transitionMs: 1,
        alpha: 0, visible: false,
      });
    }
  });

  timeSlider = createSlider(0, N_STEPS - 1, 0, 1);
  timeSlider.class("timeline");
  timeSlider.input(() => {
    dragging = true;
    stepIdx = timeSlider.value();
    endHoldUntil = 0;
    modelKey = "";
  });
  timeSlider.changed(() => { dragging = false; });

  playButton = createButton("❚❚");
  playButton.class("play");
  playButton.attribute("aria-label", "Pause");
  playButton.mousePressed(togglePlay);

  updateLayout();
  lastFrameMs = millis();
}

function togglePlay() {
  playing = !playing;
  playButton.html(playing ? "❚❚" : "▶");
  playButton.attribute("aria-label", playing ? "Pause" : "Play");
}

function keyPressed() {
  if (key === " ") { togglePlay(); return false; }
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  updateLayout();
}

function updateLayout() {
  lakeLeft = leftMargin;
  lakeRight = width - rightMargin;
  lakeTop = Math.max(110, Math.round(height * 0.16));
  bandHeight = (height - lakeTop - bottomMargin) / numRows;

  const wW = Math.ceil(width / waterResolution);
  const wH = Math.ceil((height - lakeTop) / waterResolution);
  if (!waterCanvas || waterCanvas.width !== wW || waterCanvas.height !== wH) {
    waterCanvas = document.createElement("canvas");
    waterCanvas.width = wW;
    waterCanvas.height = wH;
    waterCtx = waterCanvas.getContext("2d");
    waterData = waterCtx.createImageData(wW, wH);
  }

  const btn = 30;
  const sliderX = lakeLeft + btn + 12;
  const y = height - 84;
  playButton.position(lakeLeft, y - 6);
  timeSlider.position(sliderX, y);
  timeSlider.style("width", Math.max(160, lakeRight - sliderX) + "px");
}

// ---- advancing time -------------------------------------------------------

function advance(dt) {
  if (!playing || dragging) return;
  const now = millis();
  if (endHoldUntil) {
    if (now < endHoldUntil) return;
    endHoldUntil = 0;
    stepIdx = 0;
    dayFrac = 0;
    modelKey = "";
    return;
  }
  dayFrac += dt / DAY_MS;
  while (dayFrac >= 1) {
    dayFrac -= 1;
    if (stepIdx < N_STEPS - 1) {
      stepIdx++;
    } else {
      dayFrac = 0.999;
      endHoldUntil = now + END_HOLD_MS;
      break;
    }
  }
  timeSlider.value(stepIdx);
}

// ---- placing the Daphnia ----------------------------------------------------

// Fish (the model's predators, fish per 1000 m^3): one NTL-LTER sonar
// survey per summer, 2001-2024 (see scripts/build_timeline_data.py). Each
// survey's profile is used for its whole calendar year. Before 2001 there
// are no surveys in this record, so those years use the May 1992 profile
// from McAfee's example data (the same units); after the last survey, the
// latest one carries forward.
const PRED_YEARS = Object.keys(TL.predatorsByYear).map(Number).sort((a, b) => a - b);
const PRED_1992 = trmay92_df.map(r => r.predators);

function predatorsFor(i) {
  const y = stepDate(i).y;
  if (y < PRED_YEARS[0]) return { prof: PRED_1992, label: "May 1992 survey (no sonar record yet)" };
  const yy = PRED_YEARS.filter(v => v <= y).pop();
  return { prof: TL.predatorsByYear[yy], label: yy + " sonar survey" + (yy !== y ? " (latest)" : "") };
}

function modelData(i) {
  const s = STEPS[i];
  const fish = predatorsFor(i).prof;
  return trmay92_df.map((row, j) => ({ ...row, temp: s[1][j], chl: s[2][j], predators: fish[j] }));
}

function retarget(d, depth, ms, now) {
  d.prevDepth = currentDepth(d, now);
  d.targetDepth = depth;
  d.transitionStart = now;
  d.transitionMs = ms;
}

//re-runs the model (open water) or settles the dots under the ice,
//whenever the simulated hour or week changes
function updateDots(now) {
  const hour = dayFrac * 24;
  const iced = iceSince(STEPS[stepIdx][0]) !== null;
  const key = stepIdx + ":" + Math.floor(hour) + ":" + iced;

  // how many dots in each size class this week
  const dens = STEPS[stepIdx][3];
  currentPopulation = dens;
  const total = Math.min(Math.round(dens * DOTS_PER_DENSITY), MAX_DOTS);
  const counts = allocateDots(total, SIZES);
  for (const d of dots) d.visible = d.rank < counts[d.cls];

  if (key === modelKey) return;
  const wasIced = modelKey.endsWith("true");
  modelKey = key;

  if (iced) {
    if (!wasIced) for (const d of dots) retarget(d, d.winterDepth, 2500, now);
    return;
  }

  const results = dvmsimulation(n_timesteps, critical, capacity, modelData(stepIdx),
    "depth", "food_prob", "predators", "chl", "temp", k, currentLight.value);
  const final = results.filter(r => r.Timestep === n_timesteps);
  const depthBySize = {};
  for (const r of final) depthBySize[r.Size] = r.Depth;
  // glide time: a little under one simulated hour, so dots keep up with
  // the light through the day; slower coming out of the ice
  const ms = wasIced ? 2500 : Math.max(250, DAY_MS / 24 * 1.6);
  for (const d of dots) retarget(d, depthBySize[d.size], ms, now);
}

function currentDepth(d, now) {
  const t = constrain((now - d.transitionStart) / d.transitionMs, 0, 1);
  const eased = t * t * (3 - 2 * t);
  return lerp(d.prevDepth, d.targetDepth, eased);
}

// ---- spread around the optimal depth -----------------------------------
// McAfee's DaphniaDVM doesn't put a whole size class at one depth: it turns
// each class's optimal depth into a normal distribution with SD 3.84 m (a
// value he derived from field data on Daphnia in Sparkling Lake, August
// 1991), and sums the classes (McAfee 2021, "Generation of Vertical
// Distributions"). The drawing does the same: each dot draws a fixed
// standard-normal offset once, so it keeps its place in the spread as its
// size class moves. Dots are reflected at the surface and the bottom
// instead of piling up there.
const DEPTH_SPREAD_SD = 3.84;   // m
const DRAW_TOP_M = -1;          // top edge of the 0 m band
const DRAW_BOTTOM_M = 33;       // bottom edge of the 32 m band

function gaussian() {
  let u = 0, v = 0;
  while (!u) u = Math.random();
  while (!v) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

function spreadDepth(optimal, z, amount) {
  let m = optimal + z * DEPTH_SPREAD_SD * amount;
  if (m < DRAW_TOP_M) m = 2 * DRAW_TOP_M - m;
  if (m > DRAW_BOTTOM_M) m = 2 * DRAW_BOTTOM_M - m;
  return constrain(m, DRAW_TOP_M, DRAW_BOTTOM_M);
}

//a depth in meters -> pixel Y, matching the depth labels (each "N m" label
//sits at the middle of its 2 m band)
function depthToYContinuous(m) {
  return lakeTop + (m / 2 + 0.5) * bandHeight;
}

function depthToY(depthMeters, diameter, jitterFrac) {
  const bandTop = lakeTop + (depthMeters / 2) * bandHeight;
  const usable = Math.max(bandHeight - diameter, 0);
  return bandTop + diameter / 2 + jitterFrac * usable;
}

// ---- draw -------------------------------------------------------------------

function draw() {
  const now = millis();
  const dt = Math.min(now - lastFrameMs, 100);
  lastFrameMs = now;

  advance(dt);
  if (!dragging && timeSlider.value() !== stepIdx) timeSlider.value(stepIdx);
  const hour = dayFrac * 24;
  currentLight = surfaceLightAt(stepIdx, hour);
  currentWind = windAt(stepIdx, hour);
  updateDots(now);

  const iced = iceSince(STEPS[stepIdx][0]) !== null;
  iceAmount += ((iced ? 1 : 0) - iceAmount) * Math.min(1, dt / 700);

  const lightFrac = lightToFrac(currentLight.value);
  const sky = skyColors(lightFrac);

  background(6, 16, 28);
  drawSky(sky);
  drawWater(lightFrac, sky);
  drawSurface(lightFrac);
  drawDepthLabels();
  drawDaphnia(now, dt);
  drawIce(lightFrac);
  drawReadout();
  drawTimelineLabels();
  drawLegend();
}

//wind-driven ripple on open water; fades out as the ice forms
function drawSurface(lightFrac) {
  const open = 1 - iceAmount;
  if (open < 0.02) return;
  const t = millis() * 0.001;
  const wind = Math.min(currentWind, 12);
  const amp = (1.2 + wind * 0.35) * open;
  const spd = 1 + wind * 0.12;

  const glow = drawingContext.createLinearGradient(0, lakeTop, 0, lakeTop + 36);
  glow.addColorStop(0, "rgba(255,255,255," + ((0.05 + 0.2 * lightFrac) * open).toFixed(3) + ")");
  glow.addColorStop(1, "rgba(255,255,255,0)");
  drawingContext.fillStyle = glow;
  drawingContext.fillRect(0, lakeTop, width, 36);

  noFill();
  stroke(255, (40 + 120 * lightFrac) * open);
  strokeWeight(1.5);
  beginShape();
  for (let x = 0; x <= width + 8; x += 8) {
    vertex(x, lakeTop + Math.sin(x * 0.02 + t * 1.6 * spd) * amp + Math.sin(x * 0.055 - t * 1.1 * spd) * amp * 0.6);
  }
  endShape();
  strokeWeight(1);
  noStroke();
}

//a frosted slab of ice with a thin snow line on top, growing in at ice-on
//and melting out at ice-off; a few fixed hairline cracks
const iceCracks = [];
function drawIce(lightFrac) {
  if (iceAmount < 0.01) return;
  const a = iceAmount;
  const thick = 14 * a;
  const top = lakeTop - 3 * a;
  const ctx = drawingContext;

  const g = ctx.createLinearGradient(0, top, 0, top + thick + 10);
  const b = 0.55 + 0.45 * lightFrac;
  g.addColorStop(0, "rgba(" + Math.round(240 * b) + "," + Math.round(246 * b) + "," + Math.round(250 * b) + "," + (0.95 * a).toFixed(3) + ")");
  g.addColorStop(0.6, "rgba(" + Math.round(190 * b) + "," + Math.round(215 * b) + "," + Math.round(232 * b) + "," + (0.8 * a).toFixed(3) + ")");
  g.addColorStop(1, "rgba(160,195,220,0)");
  ctx.fillStyle = g;
  ctx.fillRect(0, top, width, thick + 10);

  // snow line
  ctx.fillStyle = "rgba(255,255,255," + (0.9 * a).toFixed(3) + ")";
  ctx.fillRect(0, top - 2 * a, width, 3 * a);

  // cracks
  if (!iceCracks.length) {
    for (let i = 0; i < 9; i++) {
      const x0 = random(0, 1);
      const pts = [[x0, 0]];
      for (let s = 1; s <= 4; s++) pts.push([x0 + random(-0.012, 0.012) * s, s / 4]);
      iceCracks.push(pts);
    }
  }
  stroke(120, 160, 190, 110 * a);
  strokeWeight(1);
  noFill();
  for (const pts of iceCracks) {
    beginShape();
    for (const [fx, fy] of pts) vertex(fx * width, top + fy * thick);
    endShape();
  }
  noStroke();
}

function drawDaphnia(now, dt) {
  const usableWidth = lakeRight - lakeLeft;
  const ctx = drawingContext;
  const fade = Math.min(1, dt / 400);
  const calm = 1 - 0.6 * iceAmount;   // slower, smaller motion in cold water

  for (const d of dots) {
    d.alpha += ((d.visible ? 1 : 0) - d.alpha) * fade;
    if (d.alpha < 0.02) continue;

    // open water: spread around the size class's optimal depth (the
    // spread fades out under the ice, where dots have their own spots)
    let depth = spreadDepth(currentDepth(d, now), d.spreadZ, 1 - iceAmount);
    // under the ice: a slow drift of up to ~1 m around each dot's spot
    depth += Math.sin(now * 0.00025 + d.driftPhase) * 0.9 * iceAmount;

    const bob = Math.sin(now * d.bobSpeed * calm + d.bobPhase) * d.bobAmp * calm;
    const sway = Math.sin(now * d.bobSpeed * 0.6 * calm + d.swayPhase) * swayAmp;
    const y = Math.max(depthToYContinuous(depth) + bob,
      lakeTop + d.diameter / 2 + 1 + 12 * iceAmount);
    const pad = d.diameter / 2 + 1;
    const x = lakeLeft + pad + d.xFrac * Math.max(usableWidth - 2 * pad, 0) + sway;

    ctx.globalAlpha = d.alpha;
    glowDot(x, y, d.diameter);
  }
  ctx.globalAlpha = 1;
}

// ---- labels -------------------------------------------------------------------

function drawDepthLabels() {
  const ctx = drawingContext;
  const temps = STEPS[stepIdx][1];
  ctx.save();
  ctx.shadowColor = "rgba(0,16,32,0.7)";
  ctx.shadowBlur = 4 * pixelDensity();
  noStroke();
  textAlign(RIGHT, CENTER);
  for (let i = 0; i < numRows; i++) {
    const y = lakeTop + i * bandHeight + bandHeight / 2;
    fill(255, 225);
    textSize(12);
    text(i * 2 + " m", lakeLeft - 10, y - (bandHeight > 26 ? 6 : 0));
    if (bandHeight > 26) {
      fill(191, 227, 255, 190);
      textSize(10.5);
      text(temps[i].toFixed(1) + "°", lakeLeft - 10, y + 7);
    }
  }
  ctx.restore();
}

const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const MONTHS_LONG = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

function fmtDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return MONTHS[m - 1] + " " + d + ", " + y;
}

function fmtHour(h) {
  const hh = Math.floor(h);
  const ap = hh < 12 ? "AM" : "PM";
  return ((hh + 11) % 12 + 1) + " " + ap;
}

function drawReadout() {
  const s = STEPS[stepIdx];
  const q = s[6];
  const hour = dayFrac * 24;
  const since = iceSince(s[0]);
  noStroke();
  textAlign(LEFT, BOTTOM);

  const y1 = height - 152;
  const y2 = height - 132;
  const y3 = height - 114;
  fill(255, 240);
  textSize(14);
  textStyle(BOLD);
  const head = fmtDate(s[0]) + " · " + fmtHour(hour) + " CST";
  text(head, lakeLeft, y1);
  textStyle(NORMAL);
  fill(since ? color(200, 228, 250) : color(150, 225, 170));
  const status = since
    ? "ICE COVER since " + fmtDate(since) + " — model paused, Daphnia resting under the ice"
    : "OPEN WATER — model running";
  text(status, lakeLeft + textWidth(head) + 18, y1);

  const lv = currentLight.value;
  const parts = [
    "Surface " + s[1][0].toFixed(1) + " °C (" + QUALITY_WORD[q[0]] + ")",
    "Chlorophyll " + s[2][0].toFixed(1) + " μg/L at surface (" + QUALITY_WORD[q[1]] + ")",
    "Daphnia " + s[3].toFixed(2) + "/L (" + QUALITY_WORD[q[2]] + ")",
    "Fish: " + predatorsFor(stepIdx).label,
    "Wind " + currentWind.toFixed(1) + " m/s" + (q[3] === "e" ? " (typical)" : ""),
    "Light " + (lv < 10 ? lv.toFixed(2) : Math.round(lv)) + " µmol/m²/s (" + currentLight.source + ")",
  ];
  fill(255, 205);
  textSize(12);
  text(parts.slice(0, 3).join("   ·   "), lakeLeft, y2);
  text(parts.slice(3).join("   ·   "), lakeLeft, y3);
}

//month/year above the slider thumb, and year ticks below it
function drawTimelineLabels() {
  const sx = timeSlider.x;
  const sw = timeSlider.width;
  const thumbPad = 8;
  const frac = stepIdx / (N_STEPS - 1);
  const tx = sx + thumbPad + frac * (sw - 2 * thumbPad);
  const { y, m } = stepDate(stepIdx);

  noStroke();
  fill(255, 245);
  textSize(13);
  textStyle(BOLD);
  textAlign(CENTER, BOTTOM);
  text(MONTHS_LONG[m - 1] + " " + y, constrain(tx, sx + 40, sx + sw - 40), height - 88);
  textStyle(NORMAL);

  // year ticks every 5 years
  const firstY = stepDate(0).y;
  const lastY = stepDate(N_STEPS - 1).y;
  const t0 = Date.parse(STEPS[0][0]);
  const t1 = Date.parse(STEPS[N_STEPS - 1][0]);
  textSize(10.5);
  textAlign(CENTER, TOP);
  for (let yr = Math.ceil(firstY / 5) * 5; yr <= lastY; yr += 5) {
    const f = (Date.parse(yr + "-01-01") - t0) / (t1 - t0);
    const x = sx + thumbPad + f * (sw - 2 * thumbPad);
    fill(255, 90);
    rect(x - 0.5, height - 62, 1, 5);
    fill(255, 150);
    text(yr, x, height - 55);
  }
}

function drawLegend() {
  const legendY = height - 30;
  glowDot(lakeLeft + 10, legendY, minCircleDiameter);
  glowDot(lakeLeft + 100, legendY, maxCircleDiameter);
  noStroke();
  fill(255, 225);
  textSize(13);
  textAlign(LEFT, CENTER);
  text(critical + " μg", lakeLeft + 26, legendY);
  text(capacity + " μg", lakeLeft + 120, legendY);

  const dens = currentPopulation;
  const shown = Math.min(Math.round(dens * DOTS_PER_DENSITY), MAX_DOTS);
  fill(255, 190);
  textSize(11.5);
  text("Each dot ≈ " + bigNumber(DAPHNIA_PER_DOT) + " Daphnia  ·  this week " + dens.toFixed(2) +
    " per liter ≈ " + bigNumber(dens * LAKE_VOLUME_L) + " in the lake (" + shown + " dots" +
    (shown === MAX_DOTS ? ", capped" : "") + ")", lakeLeft + 190, legendY);

  fill(255, 120);
  textSize(10);
  text("Data: NTL-LTER physical limnology, chlorophyll, zooplankton, sonar fish surveys, ice duration & Woodruff Airport weather. Space = play/pause.", lakeLeft, height - 10);
}

// ---- color helpers ---------------------------------------------------

function lerpRGB(a, b, t) {
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
}

function css(c) {
  return "rgb(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + ")";
}

//light reading -> 0..1 on a log scale
function lightToFrac(light) {
  const lo = lightRange.min;
  const hi = lightRange.max;
  return constrain(Math.log(Math.max(light, lo) / lo) / Math.log(hi / lo), 0, 1);
}

function skyColors(f) {
  for (let i = 1; i < skyStops.length; i++) {
    if (f <= skyStops[i][0]) {
      const [f0, top0, hor0] = skyStops[i - 1];
      const [f1, top1, hor1] = skyStops[i];
      const u = (f - f0) / (f1 - f0);
      return { top: lerpRGB(top0, top1, u), horizon: lerpRGB(hor0, hor1, u) };
    }
  }
  const last = skyStops[skyStops.length - 1];
  return { top: last[1], horizon: last[2] };
}

// ---- scenery -----------------------------------------------------------

//the sky: vertical gradient from the zenith color down to the horizon
function drawSky(sky) {
  const grad = drawingContext.createLinearGradient(0, 0, 0, lakeTop);
  grad.addColorStop(0, css(sky.top));
  grad.addColorStop(1, css(sky.horizon));
  drawingContext.fillStyle = grad;
  drawingContext.fillRect(0, 0, width, lakeTop);
}

//the water: two slowly drifting layers of noise blend between a calm and
//a bright tone, which reads as light moving through water. Computed in a
//small buffer (cheap) and scaled up smoothly (soft). It darkens with
//depth, dims when the light is low, and picks up a reflection of the sky
//color near the surface.
function drawWater(lightFrac, sky) {
  const t = millis() * 0.0004;
  const w = waterCanvas.width;
  const h = waterCanvas.height;
  const lakeDepthPx = numRows * bandHeight;
  // under ice, only a small share of daylight reaches the water
  const lightScale = 0.34 + 0.66 * lightFrac * (1 - (1 - UNDER_ICE_LIGHT) * iceAmount);

  const px = waterData.data;
  for (let y = 0; y < h; y++) {
    const depthFrac = (y * waterResolution) / lakeDepthPx;
    const shade = Math.max(0.22, 1 - 0.62 * depthFrac) * lightScale;
    const reflect = 0.4 * Math.pow(Math.max(0, 1 - depthFrac * 3), 2) * (1 - iceAmount);
    for (let x = 0; x < w; x++) {
      const n1 = noise(x * 0.045 + t, y * 0.09 - t * 0.6);
      const n2 = noise(x * 0.11 - t * 0.8 + 100, y * 0.2 + t * 0.9 + 50);
      const n = constrain((n1 * 0.65 + n2 * 0.35 - 0.3) / 0.4, 0, 1);

      const r = (waterCalm[0] + (waterBright[0] - waterCalm[0]) * n) * shade;
      const g = (waterCalm[1] + (waterBright[1] - waterCalm[1]) * n) * shade;
      const b = (waterCalm[2] + (waterBright[2] - waterCalm[2]) * n) * shade;

      const i = 4 * (y * w + x);
      px[i]     = r + (sky.horizon[0] - r) * reflect;
      px[i + 1] = g + (sky.horizon[1] - g) * reflect;
      px[i + 2] = b + (sky.horizon[2] - b) * reflect;
      px[i + 3] = 255;
    }
  }
  waterCtx.putImageData(waterData, 0, 0);
  drawingContext.imageSmoothingEnabled = true;
  drawingContext.imageSmoothingQuality = "high";
  drawingContext.drawImage(waterCanvas, 0, lakeTop, width, height - lakeTop);
}

// ---- Daphnia -----------------------------------------------------------

//a white circle with a soft halo and glow.
//With hundreds of dots, canvas shadowBlur on every dot every frame is far
//too slow, so each diameter's glow is rendered once into a small sprite
//canvas and then just stamped with drawImage.
const glowSprites = new Map();

function getGlowSprite(diameter) {
  const key = diameter.toFixed(2);
  let s = glowSprites.get(key);
  if (s) return s;

  const density = pixelDensity();
  const blur = 4 + diameter * 0.8;
  const half = diameter / 2 + blur * 1.6 + 2; // CSS px from center to edge
  const c = document.createElement("canvas");
  c.width = c.height = Math.ceil(half * 2 * density);
  const g = c.getContext("2d");
  g.scale(density, density);

  // faint halo
  g.fillStyle = "rgba(255,255,255,0.13)";
  g.beginPath(); g.arc(half, half, diameter * 1.15, 0, Math.PI * 2); g.fill();

  // glowing core (two passes, like the original look)
  g.fillStyle = "#fff";
  g.shadowColor = "rgba(255,255,255,0.95)";
  g.shadowBlur = blur * density;
  g.beginPath(); g.arc(half, half, diameter / 2, 0, Math.PI * 2); g.fill();
  g.shadowBlur = (2 + diameter * 0.3) * density;
  g.beginPath(); g.arc(half, half, diameter / 2, 0, Math.PI * 2); g.fill();

  s = { canvas: c, half };
  glowSprites.set(key, s);
  return s;
}

function glowDot(x, y, diameter) {
  const s = getGlowSprite(diameter);
  drawingContext.drawImage(s.canvas, x - s.half, y - s.half, s.half * 2, s.half * 2);
}
